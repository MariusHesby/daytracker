<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners (app icon style) -->
  <rect width="512" height="512" rx="112" fill="url(#gradient)"/>
  
  <!-- Stylized "D" shape -->
  <path d="M160 120 L160 392 L280 392 C360 392 420 320 420 256 C420 192 360 120 280 120 L160 120 Z" 
        fill="none" 
        stroke="white" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Timeline dots inside the D -->
  <circle cx="220" cy="200" r="20" fill="white"/>
  <circle cx="220" cy="256" r="20" fill="white"/>
  <circle cx="220" cy="312" r="20" fill="white"/>
  
  <!-- Connecting lines -->
  <line x1="240" y1="200" x2="320" y2="200" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="240" y1="256" x2="340" y2="256" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <line x1="240" y1="312" x2="300" y2="312" stroke="white" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF"/>
      <stop offset="100%" style="stop-color:#5856D6"/>
    </linearGradient>
  </defs>
</svg>
